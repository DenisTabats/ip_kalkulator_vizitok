<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт стоиости визиток</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="display-4 text-center mb-4">Стоимость визиток</h1>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4">
                        <h2 class="h4 mb-3">Параметры заказа</h2>

                        <div class="mb-3">
                            <label class="form-label" for="qty">Тираж</label>
                            <input type="number" id="qty" class="form-control"
                                   value="90" min="30" step="30">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="paper">Бумага</label>
                            <select id="paper" class="form-select"></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="color">Цветность</label>
                            <select id="color" class="form-select"></select>
                        </div>

                        <hr>
                        <p class="mb-1 text-muted">Итого к оплате</p>
                        <p class="display-5 mb-0"><span id="total">0</span> ₽</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
